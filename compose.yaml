name: reparix-openup
services:
  db:
    image: postgres@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_USER: reparix_owner
      POSTGRES_DB: reparix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["reparix_pg:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reparix_owner -d reparix"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  reparix_pg: